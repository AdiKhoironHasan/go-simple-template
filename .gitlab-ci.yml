before_script:
  - echo "Starting before script"
  # - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  - echo "$ENV_DEV_FILE" >> .env
  - cat .env
  - echo "Before script completed"

# Development
build-development:
  only:
    - development
  tags:
    - all-env # tags is for selecting runner with related tag
  stage: build
  environment:
    name: development
  script:
    - echo "Starting build"
    - docker build --tag go-simple-app:$CI_COMMIT_SHORT_SHA .
    # - docker tag go-simple-app:$$CI_COMMIT_SHORT_SHA registry.gitlab.com/manageree/go-simple-app:$$CI_COMMIT_SHORT_SHA
    # - docker push registry.gitlab.com/manageree/go-simple-app:$$CI_COMMIT_SHORT_SHA
    - echo "Build completed"

deploy-development:
  only:
    - development
  tags:
    - all-env
  stage: deploy
  environment:
    name: development
  script:
    - echo "Starting deployment"
    - docker stop dev-go-simple-app || true && docker rm dev-go-simple-app || true
    - docker run -d
      --name dev-go-simple-app
      -p 8082:8080
      --env-file .env
      go-simple-app:${CI_COMMIT_SHORT_SHA}
    - echo "Deployment completed"

