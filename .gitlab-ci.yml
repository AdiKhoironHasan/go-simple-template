stages:
  - build
  - deploy
  - test

test:
  stage: test
  tags:
    - all-env # tags is for selecting runner with related tag
  script:
    - go fmt $(go list ./... | grep -v /vendor/)
    - go vet $(go list ./... | grep -v /vendor/)
    - go test -race $(go list ./... | grep -v /vendor/)

# Development
build-development:
  only:
    - development
  tags:
    - all-env
  stage: build
  environment:
    name: development
  script:
    - echo "Starting build"
    - docker build --tag go-simple-app:latest -f Dockerfile .
    # - docker tag go-simple-app:$CI_COMMIT_SHA registry.gitlab.com/manageree/go-simple-app:$CI_COMMIT_SHA
    # - docker push registry.gitlab.com/manageree/go-simple-app:$CI_COMMIT_SHA
    - echo "Build completed"

deploy-development:
  only:
    - development
  tags:
    - all-env
  stage: deploy
  environment:
    name: development
  script:
    - echo "Starting deployment"
    - docker run -d -p 8082:8080 go-simple-app:latest
    - echo "Deployment completed"

