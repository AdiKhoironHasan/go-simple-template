# Development
build-development:
  only:
    - development
  tags:
    - all-env # tags is for selecting runner with related tag
  stage: build
  environment:
    name: development
  script:
    - echo "Starting build"
    - docker build --tag go-simple-app:$CI_COMMIT_SHORT_SHA -f Dockerfile .
    # - docker tag go-simple-app:$$CI_COMMIT_SHORT_SHA registry.gitlab.com/manageree/go-simple-app:$$CI_COMMIT_SHORT_SHA
    # - docker push registry.gitlab.com/manageree/go-simple-app:$$CI_COMMIT_SHORT_SHA
    - echo "Build completed"

deploy-development:
  only:
    - development
  tags:
    - all-env
  stage: deploy
  environment:
    name: development
  script:
    - echo "Starting deployment"
    - docker run -d -p 8082:8080 go-simple-app:$CI_COMMIT_SHORT_SHA
    - echo "Deployment completed"

