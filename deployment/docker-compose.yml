services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_NAME=go-simple-template
      - APP_VERSION=1.0.0
      - APP_PORT=80
      - APP_DEBUG=true
      - MONGODB_PROTOCOL=mongodb
      - MONGODB_ADDRESS=mongo:27017
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=secret
      - MONGODB_NAME=go-simple
      - MONGODB_OPTION=?authSource=admin
      - MONGODB_MAX_CONN_OPEN=100
      - MONGODB_MAX_CONN_IDLE=10
      - MONGODB_MAX_CONN_LIFETIME=1h
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_TLS=false
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.2
    ports:
      - "37017:27017"
    environment:
      MONGO_INITDB_DATABASE: go-simple
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u admin -p secret --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "7379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
